<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="osxphotos-mcp: your Apple Photos library, for AI assistants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#27214f"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="-84" y="-78" width="168" height="124" rx="6"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>

  <!-- a small stack of photos -->
  <g transform="translate(200 160)">
    <rect x="-100" y="-94" width="200" height="188" rx="14" fill="url(#amber)" transform="rotate(-14)"/>
    <rect x="-100" y="-94" width="200" height="188" rx="14" fill="url(#pink)" transform="rotate(9)"/>
    <g transform="rotate(-3)">
      <rect x="-100" y="-94" width="200" height="188" rx="14" fill="#f8fafc"/>
      <g clip-path="url(#frame)">
        <rect x="-84" y="-78" width="168" height="124" fill="url(#sky)"/>
        <circle cx="42" cy="-36" r="17" fill="#fff7ed"/>
        <path d="M-84 46 L-30 -22 L8 20 L34 -6 L84 46 Z" fill="#0f766e"/>
        <path d="M-84 46 L-52 6 L-14 46 Z" fill="#115e59"/>
      </g>
      <rect x="-84" y="60" width="92" height="10" rx="5" fill="#cbd5e1"/>
    </g>
  </g>

  <!-- title -->
  <text x="372" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="700" fill="#f8fafc">osxphotos-mcp</text>
  <text x="374" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#cbd5e1">Your Apple Photos library, for AI assistants</text>

  <!-- what it does -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="374" y="222" width="112" height="40" rx="20" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="430" y="249" fill="#7dd3fc">search</text>
    <rect x="500" y="222" width="116" height="40" rx="20" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="558" y="249" fill="#f9a8d4">inspect</text>
    <rect x="630" y="222" width="108" height="40" rx="20" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="684" y="249" fill="#fcd34d">export</text>
  </g>
</svg>
